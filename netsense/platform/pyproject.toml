[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netsense-platform"
version = "0.1.0"
description = "Authenticated, tenant-scoped NetSense platform API kernel"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.109,<1",
  "jsonschema[format]>=4.21,<5",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=4.1,<8",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=netsense_platform --cov-branch --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
]
