services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: netsense_test
      POSTGRES_USER: netsense_migrator
      POSTGRES_PASSWORD: netsense_migrator_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsense_migrator -d netsense_test"]
      interval: 1s
      timeout: 3s
      retries: 30
