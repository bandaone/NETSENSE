openapi: 3.1.0
info:
  title: NetSense Platform API
  version: 1.0.0
  description: >-
    Tenant-scoped API for Atlas topology and incident workflows. The schemas
    are generated from the validated TypeScript domain models and consumed by
    the authenticated Python platform. PostgreSQL persistence and database RLS
    are implemented; ingestion, rate limiting, and WebSocket streaming are not.
x-netsense-status: platform-persistence-implemented-streaming-planned
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: netsense.example
security:
  - bearerAuth: []

paths:
  /sites/{siteId}/topology:
    get:
      operationId: getTopologySnapshot
      summary: Return one validated topology snapshot
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: observedAt
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Tenant-scoped topology snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologySnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sites/{siteId}/topology/stream:
    get:
      operationId: connectTopologyStream
      summary: Upgrade to an authenticated topology-diff WebSocket
      description: >-
        Messages conform to topology-diff-schema.json. Clients reject unsupported
        schema versions and cross-scope updates, ignore duplicate or stale sequence
        numbers, and request a bounded snapshot refresh after a gap or base-snapshot
        mismatch.
      x-websocket: true
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: afterSequence
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sites/{siteId}/incidents:
    get:
      operationId: listIncidents
      summary: List incidents visible to the authenticated tenant and role
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/IncidentState' }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cursor-paginated incidents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /incidents/{incidentId}:
    get:
      operationId: getIncidentCase
      summary: Return one validated incident case with its evidence context
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Tenant-scoped incident evidence and topology context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /incidents/{incidentId}/analysis:
    get:
      operationId: getIncidentAnalysis
      summary: Return validated deterministic incident analysis output
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Evidence-backed analysis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentAnalysis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /incidents/{incidentId}/acknowledgements:
    post:
      operationId: acknowledgeIncident
      summary: Acknowledge one open incident
      x-required-roles: [engineer, senior, admin]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentAcknowledgementRequest' }
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /incidents/{incidentId}/notes:
    put:
      operationId: updateIncidentNotes
      summary: Persist investigation notes while an incident remains active
      x-required-roles: [engineer, senior, admin]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentNotesRequest' }
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /incidents/{incidentId}/resolution:
    post:
      operationId: resolveIncident
      summary: Resolve an acknowledged incident with evidence-backed notes
      x-required-roles: [senior, admin]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentResolutionRequest' }
      responses:
        '200':
          description: Resolved incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }

  responses:
    Unauthorized:
      description: Authentication is absent, expired, or invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The authenticated principal cannot access the tenant resource or operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource is absent or not visible in the authenticated tenant scope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Expected state, sequence, or idempotency precondition failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidRequest:
      description: Request failed structural or business validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Authenticated principal or tenant exceeded a bounded request rate
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      $ref: './problem-schema.json'
    TopologySnapshot:
      $ref: './topology-snapshot-schema.json'
    TopologyDiff:
      $ref: './topology-diff-schema.json'
    IncidentState:
      type: string
      enum: [open, acknowledged, resolved]
    IncidentList:
      $ref: './incident-list-schema.json'
    IncidentSummary:
      $ref: './incident-summary-schema.json'
    IncidentCase:
      $ref: './incident-case-schema.json'
    IncidentAnalysis:
      $ref: './incident-analysis-schema.json'
    IncidentAcknowledgementRequest:
      $ref: './incident-acknowledgement-request-schema.json'
    IncidentNotesRequest:
      $ref: './incident-notes-request-schema.json'
    IncidentResolutionRequest:
      $ref: './incident-resolution-request-schema.json'
